<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=block">
<style>:root{--w:1080px;--h:1350px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:var(--w);height:var(--h);background:#0b0e14;overflow:hidden}
body{font-family:'Inter',system-ui,sans-serif;color:#fafafa;-webkit-font-smoothing:antialiased;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(circle at 78% 8%, #8455FB2e 0%, transparent 46%),radial-gradient(circle at 10% 100%, #8455FB14 0%, transparent 40%);pointer-events:none}
.lienzo{position:absolute;inset:0;padding:76px 80px;display:flex;flex-direction:column}
.marca{display:flex;align-items:center;gap:16px;font-size:34px;font-weight:700;letter-spacing:-.5px}
.marca img{width:48px;height:48px}
.kicker{display:inline-flex;align-items:center;gap:12px;font-size:24px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:#71717a}
.kicker i{width:12px;height:12px;border-radius:6px;display:inline-block}
h1{font-size:92px;line-height:1.02;letter-spacing:-3.4px;font-weight:700}
h1 .gris{color:#a1a1aa}
.sub{font-size:34px;line-height:1.45;color:#a1a1aa;letter-spacing:-.2px}
.card{background:#161b22;border:1.5px solid #262c36;border-radius:32px;box-shadow:0 50px 100px -50px rgba(0,0,0,.8)}
.barra{display:flex;align-items:center;gap:12px;padding:22px 30px;border-bottom:1.5px solid #1d222b;font-size:22px;color:#a1a1aa;font-weight:600}
.barra .p{width:13px;height:13px;border-radius:7px;background:#262c36}
.barra .tag{margin-left:auto;font-size:17px;letter-spacing:1px;text-transform:uppercase;color:#71717a;font-weight:500}
.num{font-variant-numeric:tabular-nums}
.medio{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 0 40px}
.medio>:first-child{margin-top:0!important}
.pie{display:flex;align-items:center;gap:22px}
.cta{background:#7c3aed;color:#fff;border-radius:999px;padding:24px 40px;font-size:30px;font-weight:600;white-space:nowrap}
.pie .txt{font-size:24px;color:#71717a;line-height:1.4}
.pie .txt b{color:#fafafa;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:12px;border:1.5px solid #262c36;border-radius:999px;padding:12px 22px;font-size:24px;color:#a1a1aa;font-weight:500;background:#0b0e14cc}
.chip img{height:28px}

.big{font-size:250px;font-weight:800;letter-spacing:-12px;line-height:.9;margin-top:24px} .big span{color:#71717a}
.fr{display:flex;align-items:center;gap:20px;font-size:26px;color:#a1a1aa;padding:20px 0;border-top:1.5px solid #1d222b}
.fr:first-child{border-top:none} .fr span{flex:1} .fr b{color:#fafafa;font-weight:700} .fr em{font-style:normal;color:#4ade80;font-weight:700}
</style></head>
